services:
  - type: web
    name: watar-website
    runtime: docker
    plan: free            # free instances sleep after 15 min idle; first visit then takes ~1 min
    region: frankfurt     # closest Render region to Saudi Arabia
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Render asks you for it once — never commit it
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: CLINIC_ADAPTER_KEY
        generateValue: true
      - key: WEB_MAX_SECONDS
        value: "240"
      - key: WEB_MAX_CALLS
        value: "5"
      # After the first deploy, set this to your site address to block other sites from using your demo:
      # - key: ALLOWED_ORIGINS
      #   value: https://watar-website.onrender.com
